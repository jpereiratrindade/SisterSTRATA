name: STRATA-CI

on:
  push:
  pull_request:

jobs:
  f1-hardening:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            libglm-dev \
            ripgrep \
            libssl-dev

      - name: Run Governance Gates
        run: |
          bash scripts/validate_governance.sh ${GITHUB_WORKSPACE}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTRATA_BUILD_WORLD3D=OFF

      - name: Build
        run: cmake --build build --target application_mapper_tests core_infrastructure_tests

      - name: Run ADR Gates
        run: |
          ctest --test-dir build --output-on-failure -R "ApplicationMapperTest|CoreInfrastructureTest|MembraneDependencyGuard|CoreDomainBoundaryGuard"
