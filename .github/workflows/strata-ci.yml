name: STRATA-CI

on:
  push:
  pull_request:

jobs:
  f1-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            gcc-12 \
            g++-12 \
            libglm-dev \
            ripgrep \
            libssl-dev

      - name: Run Governance Gates
        run: |
          bash scripts/validate_governance.sh ${GITHUB_WORKSPACE}

      - name: Configure
        run: |
          cmake --preset headless \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -g -fno-fast-math" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -g -fno-fast-math -ffp-contract=off"

      - name: Build
        run: cmake --build --preset headless

      - name: Run ADR Gates - Application Contracts
        run: |
          ctest --test-dir build/headless --output-on-failure -R "ApplicationMapper_MembraneContract|ApplicationMapper_CrossContextIsolation|ApplicationMapper_InfrastructureResilience"

      - name: Run ADR Gates - Core Scientific Suites
        run: |
          ctest --test-dir build/headless --output-on-failure -R "CoreWorkspaceTest|CorePatchAnalysisTest|CoreSoilRasterizerTest|CorePatchTrajectoryTest|CoreTrajectoryLODTest|CoreVegVectorTest|CoreSlopeFixTest|CoreInfrastructureTest|CoreEnergyAllocationPolicyTest|CoreHydroDomainTest|CoreEnvironmentControllerDeterminismTest|CoreHypothesisIdDeterminismTest"

      - name: Run ADR Gates - Static Contract Guards
        run: |
          ctest --test-dir build/headless --output-on-failure -R "MembraneDependencyGuard|CoreDomainBoundaryGuard|CoreDeterminismPrimitiveGuard|ExceptionBoundaryGuard|GitArtifactHygieneGuard|VersionAlignmentGuard"

      - name: Run Full Headless Test Suite
        run: |
          ctest --test-dir build/headless --output-on-failure

  f2-determinism-replay:
    timeout-minutes: 20
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            gcc-12 \
            g++-12 \
            libglm-dev \
            ripgrep \
            libssl-dev

      - name: Configure
        run: |
          cmake --preset headless \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -g -fno-fast-math" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -g -fno-fast-math -ffp-contract=off"

      - name: Build Determinism Probe Test Binary
        run: cmake --build --preset headless --target application_mapper_tests

      - name: Run Determinism Replay Probe
        run: |
          ./build/headless/bin/application_mapper_tests \
            --gtest_filter=InfrastructureResilienceRunTest.StateHashMatchesCanonicalPayloadAndReplayPayloadIsIdentical \
            | tee build/headless/determinism_probe.log

      - name: Extract Deterministic State Hash
        run: |
          HASH="$(rg -o 'DETERMINISM_STATE_HASH=[0-9a-f]{64}' build/headless/determinism_probe.log | head -n 1 | cut -d '=' -f 2)"
          if [[ -z "${HASH}" ]]; then
            echo "[determinism-replay] state hash marker not found in probe log."
            exit 1
          fi
          mkdir -p build/headless/determinism
          printf '%s\n' "${HASH}" > build/headless/determinism/state_hash.txt
          echo "[determinism-replay] extracted state_hash=${HASH}"

      - name: Upload Determinism Hash Artifact
        uses: actions/upload-artifact@v4
        with:
          name: determinism-state-hash-${{ matrix.os }}
          path: build/headless/determinism/state_hash.txt

  f2-determinism-compare:
    timeout-minutes: 10
    needs: f2-determinism-replay
    runs-on: ubuntu-latest
    if: always()
    env:
      STRATA_DETERMINISM_COMPARE_MODE: enforce

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Hash Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: determinism-state-hash-*
          path: determinism-hashes

      - name: Compare Determinism Hashes Across Runners
        run: |
          bash scripts/compare_determinism_hashes.sh determinism-hashes "${STRATA_DETERMINISM_COMPARE_MODE}"

  f2-determinism-stability-window:
    timeout-minutes: 10
    needs: f2-determinism-compare
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: read
      contents: read
    env:
      STRATA_DETERMINISM_STABILITY_MODE: adaptive
      STRATA_DETERMINISM_STABILITY_WINDOW: "20"
      STRATA_DETERMINISM_STABILITY_MIN_SAMPLES: "5"
      STRATA_DETERMINISM_STABILITY_PROMOTION_MIN_SAMPLES: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Hash Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: determinism-state-hash-*
          path: determinism-hashes

      - name: Analyze Determinism Stability Window
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check_determinism_stability_window.py \
            --hash-root determinism-hashes \
            --repo "${GITHUB_REPOSITORY}" \
            --branch "main" \
            --workflow-name "${GITHUB_WORKFLOW}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --window "${STRATA_DETERMINISM_STABILITY_WINDOW}" \
            --min-samples "${STRATA_DETERMINISM_STABILITY_MIN_SAMPLES}" \
            --promotion-min-samples "${STRATA_DETERMINISM_STABILITY_PROMOTION_MIN_SAMPLES}" \
            --mode "${STRATA_DETERMINISM_STABILITY_MODE}"

      - name: Upload Stability Window Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: determinism-stability-window-report
          path: |
            build/headless/determinism/stability_window_summary.md
            build/headless/determinism/stability_window_report.json
            build/headless/determinism/stability_window_promotion_ready.txt
          if-no-files-found: warn

      - name: Publish Stability Window Summary
        run: |
          SUMMARY="build/headless/determinism/stability_window_summary.md"
          READY="build/headless/determinism/stability_window_promotion_ready.txt"
          if [[ -f "${SUMMARY}" ]]; then
            cat "${SUMMARY}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No determinism stability summary was generated." >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -f "${READY}" ]]; then
            VALUE="$(tr -d '[:space:]' < "${READY}")"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "- Promotion ready flag: \`${VALUE}\`" >> "${GITHUB_STEP_SUMMARY}"
          fi
